apiVersion: apps/v1
kind: Deployment
metadata:
  name: updater
  namespace: prod
spec:
  replicas: 2 # 1 -> 2: tek replica spof. en az 2 replica olmalı.
  strategy:
    type: RollingUpdate  # Recreate yerine: deployment sırasında downtime olmasın.
  selector:
    matchLabels:
      app: updater
  template:
    metadata:
      labels:
        app: updater
    spec:
      containers:
        - name: updater
          # :latest yerine sabit image tag kullanılmalı. hangi sürüm prod'da net olmalı. 
          image: berqnet/updater@sha256:REPLACE_WITH_REAL_DIGEST 
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # token artık plaintext değil, k8s'de secrettan okunuyor.  
            - name: UPDATE_FEED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: updater-secrets
                  key: update-feed-token 
---
apiVersion: v1
kind: Service
metadata:
  name: updater
  namespace: prod
spec:
  selector:
    app: updater # BUG fix: updater-svc -> updater. selector eşleşmezse service ilgili pod'a bağlanmaz.
  ports:
    - port: 80
      targetPort: 8080
